<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>AYQ</title>
<style>
  /* The page itself holds no design.
     Colour, metric and type are `ayq-tokens.ts`, and every screen, the rail
     and the status bar are drawn by the application (04 A15, A20). What is
     left here is the ground the window sits on before the first paint, which
     is the one moment the application cannot have painted it yet. */

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    /* Before the first paint, and only until then: the application paints its
       own ground the moment it knows which one to paint. */
    background: #f4f5f6;
    color: #14181b;
    font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #ayq-root { height: 100%; }

</style>
</head>
<body>
<div id="ayq-root"></div>
<script type="module" src="./ayq-client.js"></script>
</body>
</html>
