<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>AYQ</title>
<style>
  :root { --bg:#fbfbfa; --panel:#fff; --ink:#16171a; --muted:#6b6f76; --line:#e4e4e1; --accent:#1b4d3e; --in:#1b4d3e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121316; --panel:#191a1e; --ink:#e8e8e6; --muted:#9a9ea6; --line:#2a2c31; --accent:#7fc4a8; --in:#7fc4a8; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main { max-width:760px; margin:0 auto; padding:36px 28px 48px; }
  .bar { display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin:0 0 4px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:-.01em; margin:0; }
  button {
    font:inherit; font-weight:550; color:var(--panel); background:var(--accent);
    border:1px solid transparent; border-radius:3px; padding:8px 14px; cursor:pointer;
  }
  button:disabled { opacity:.55; cursor:default; }

  #ayq-import-result { min-height:20px; margin:10px 0 22px; font-size:12.5px; color:var(--muted); }
  .import-done { color:var(--ink); border-left:2px solid var(--accent); padding-left:10px; margin:0; }
  .waiting, .muted { margin:0; color:var(--muted); }

  .ledger { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:3px; }
  .ledger th {
    text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    font-weight:500; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line);
  }
  .ledger td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  .ledger tr:last-child td { border-bottom:0; }
  .col-date { white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--muted); width:1%; }
  .col-account { white-space:nowrap; color:var(--muted); width:1%; }
  .col-amount { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; width:1%; }
  tr.in .col-amount { color:var(--in); font-weight:550; }
  .ledger-count { margin:10px 2px 0; font-size:12px; color:var(--muted); }

  .empty-title { margin:26px 0 6px; font-size:16px; font-weight:550; }
  .empty-body { margin:0; max-width:46ch; color:var(--muted); }

  .error { color:#b3261e; white-space:pre-wrap; font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  footer { margin-top:36px; padding-top:12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1>AYQ</h1>
    <button id="ayq-import" type="button">Import CAMT.053</button>
  </div>
  <div id="ayq-import-result"></div>
  <div id="ayq-body"><p class="waiting">Opening the budget…</p></div>
  <footer id="ayq-engine-note"></footer>
</main>
<script type="module" src="./ayq-client.js"></script>
</body>
</html>
