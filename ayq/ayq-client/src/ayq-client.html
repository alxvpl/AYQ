<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>AYQ</title>
<style>
  /* The page itself holds no design.
     Colour, metric and type are `ayq-tokens.ts`, and the shell, the rail and
     the status bar are drawn by the application (04 A15, A20). What is left
     here is the ground the window sits on before the first paint, and the
     styles of the screens that have not been brought over to Fluent yet —
     which read the same tokens through the aliases below, so that a screen
     still waiting its turn follows the ground like everything else. Every one
     of them goes, and this block with them. */

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    /* Before the first paint, and only until then: the application paints its
       own ground the moment it knows which one to paint. */
    background: #f4f5f6;
    color: #14181b;
    font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #ayq-root { height: 100%; }

  /* ---- the screens that are still the old ones ------------------------- */

  [data-ayq-ground] {
    --panel: var(--ayq-pane);
    --sunk: var(--ayq-ground);
    --ink: var(--ayq-ink);
    --muted: var(--ayq-ink-faint);
    --line: var(--ayq-line);
    --accent: var(--ayq-accent-pressed);
    --in: var(--ayq-ink);
    --out: var(--ayq-ink);
    --warn: var(--ayq-state-overdue-fg);
  }

  [data-ayq-legacy] h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; color: var(--ink); }
  [data-ayq-legacy] h3 {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; margin: 16px 0 6px;
  }
  [data-ayq-legacy] p { color: var(--ink); }

  [data-ayq-legacy] button {
    font: inherit; font-weight: 550;
    color: var(--ayq-accent); background: var(--ayq-button-fill);
    border: 1px solid var(--ayq-button-fill); border-radius: 3px;
    padding: 5px 12px; cursor: pointer;
  }
  [data-ayq-legacy] button:hover:not(:disabled) {
    background: var(--ayq-button-fill-hover); border-color: var(--ayq-button-fill-hover);
  }
  [data-ayq-legacy] button:disabled { opacity: .45; cursor: default; }
  [data-ayq-legacy] button.quiet {
    background: transparent; color: var(--ink); border-color: var(--ayq-line-strong);
  }
  [data-ayq-legacy] button.quiet:hover:not(:disabled) { background: var(--ayq-row-hover); }
  [data-ayq-legacy] button.small { padding: 3px 9px; font-size: 12.5px; font-weight: 500; }
  [data-ayq-legacy] button:focus-visible {
    outline: 2px solid var(--ayq-accent-focus); outline-offset: 1px;
  }

  [data-ayq-legacy] input, [data-ayq-legacy] select {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--ayq-line-strong); border-radius: 3px; padding: 4px 8px;
  }
  [data-ayq-legacy] input:focus-visible, [data-ayq-legacy] select:focus-visible {
    outline: 2px solid var(--ayq-accent-focus); outline-offset: 0;
  }
  [data-ayq-legacy] input.search { flex: 1 1 260px; max-width: 420px; }

  [data-ayq-legacy] .grid {
    width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px;
  }
  [data-ayq-legacy] .grid th {
    /* A22: the header stays while the rows move. The scroller is the screen's,
       so sticking to its top is sticking to the top of the table's viewport. */
    position: sticky; top: 0; z-index: 1; background: var(--panel);
    text-align: left; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    font-weight: 500; color: var(--muted); padding: 9px 12px;
    border-bottom: 1px solid var(--ayq-line-strong);
  }
  [data-ayq-legacy] .grid td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  [data-ayq-legacy] .grid tr:last-child td { border-bottom: 0; }
  [data-ayq-legacy] .grid tr.clickable { cursor: pointer; }
  /* Focus is visible everywhere, rows included. */
  [data-ayq-legacy] .grid tbody tr:focus-visible {
    outline: 2px solid var(--ayq-accent-focus); outline-offset: -2px;
  }
  [data-ayq-legacy] .grid tr.clickable:hover td { background: var(--ayq-row-hover); }
  [data-ayq-legacy] .grid tr.open td, [data-ayq-legacy] .grid tbody tr.current td {
    background: var(--ayq-row-selected);
  }
  [data-ayq-legacy] .col-date, [data-ayq-legacy] .col-account,
  [data-ayq-legacy] .col-category { white-space: nowrap; color: var(--muted); width: 1%; }
  /* A19: figures are the interface face with tabular numerals, right-aligned,
     and a negative amount carries a minus rather than a colour. */
  [data-ayq-legacy] .col-amount {
    text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%;
    color: var(--ink);
  }
  [data-ayq-legacy] .col-amount .in, [data-ayq-legacy] .col-amount .out { color: var(--ink); }
  [data-ayq-legacy] .col-amount .in { font-weight: 550; }
  [data-ayq-legacy] .col-category select {
    max-width: 170px; padding: 2px 4px; font-size: 12.5px;
    background: transparent; border-color: transparent; color: var(--ink);
  }
  [data-ayq-legacy] .col-category select:hover,
  [data-ayq-legacy] .col-category select:focus { border-color: var(--ayq-line-strong); background: var(--panel); }
  [data-ayq-legacy] .col-category select.category-unset { color: var(--muted); }

  [data-ayq-legacy] .variant { display: flex; flex-direction: column; gap: 1px; }
  [data-ayq-legacy] .variant-key { font-weight: 550; }
  [data-ayq-legacy] .variant-names { font-size: 11.5px; color: var(--muted); }

  [data-ayq-legacy] .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  [data-ayq-legacy] .check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  [data-ayq-legacy] .check input { padding: 0; accent-color: var(--ayq-accent); }

  [data-ayq-legacy] .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 4px 3px 9px; font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  [data-ayq-legacy] .tag {
    margin-left: 6px; padding: 1px 6px; border-radius: 9px; font-size: 10.5px;
    color: var(--ayq-state-neutral-fg); background: var(--ayq-state-neutral-bg);
    border: 1px solid transparent;
  }
  [data-ayq-legacy] .tag.warn {
    color: var(--ayq-state-overdue-fg); background: var(--ayq-state-overdue-bg);
  }

  [data-ayq-legacy] .figures { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
  [data-ayq-legacy] .figure {
    display: flex; flex-direction: column; gap: 2px; min-width: 118px;
    padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
  }
  [data-ayq-legacy] .figure-label { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  [data-ayq-legacy] .figure-value { font-size: 16px; font-variant-numeric: tabular-nums; font-weight: 550; color: var(--ink); }
  [data-ayq-legacy] .figure-value.in { color: var(--ink); }
  [data-ayq-legacy] .figure-hint { font-size: 10.5px; color: var(--muted); }

  [data-ayq-legacy] .offer {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 10px 0 0; padding: 8px 11px; font-size: 12.5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
  }
  [data-ayq-legacy] .count { margin: 9px 2px 0; font-size: 12px; color: var(--muted); }

  [data-ayq-legacy] .detail {
    margin: 16px 0 0; padding: 14px 16px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px;
  }
  [data-ayq-legacy] .facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 18px; margin: 0; }
  [data-ayq-legacy] .facts dt {
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }
  [data-ayq-legacy] .facts dd { margin: 0; overflow-wrap: anywhere; }
  [data-ayq-legacy] .categorise { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  [data-ayq-legacy] .categorise select { min-width: 240px; }
  [data-ayq-legacy] .categorise .check { margin-top: 8px; }

  /* 04 A4: the table is the screen and the pane beside it is where the
     selected record is read and changed. A22: the pane stays with the row
     rather than scrolling away from it. */
  [data-ayq-legacy] .workbench { display: flex; gap: 14px; align-items: flex-start; }
  [data-ayq-legacy] .workbench-main { flex: 1 1 auto; min-width: 0; }
  [data-ayq-legacy] .workbench-pane {
    position: sticky; top: 0;
    flex: 0 0 390px; max-width: 390px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
  }
  [data-ayq-legacy] .workbench-pane h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  [data-ayq-legacy] .pane-heading {
    margin: 16px 0 8px; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
  }
  [data-ayq-legacy] .pane-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  [data-ayq-legacy] .pane-note { flex: 1 0 100%; margin: 0; font-size: 12px; color: var(--muted); }
  [data-ayq-legacy] .pane-form { display: flex; flex-direction: column; gap: 8px; }
  [data-ayq-legacy] .pane-field { display: flex; flex-direction: column; gap: 3px; }
  [data-ayq-legacy] .pane-field-label {
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }
  [data-ayq-legacy] .pane-field input, [data-ayq-legacy] .pane-field select { width: 100%; }

  /* The one editable cell on the plan sheet: a number in a column of numbers. */
  [data-ayq-legacy] .plan-input {
    width: 100px; padding: 3px 6px; text-align: right;
    font: inherit; font-variant-numeric: tabular-nums;
    color: var(--ink); background: transparent;
    border: 1px solid transparent; border-radius: 3px;
  }
  [data-ayq-legacy] .plan-input:hover:not(:disabled), [data-ayq-legacy] .plan-input:focus {
    background: var(--panel); border-color: var(--ayq-line-strong);
  }
  [data-ayq-legacy] .plan-input:disabled { color: var(--muted); }
  [data-ayq-legacy] .grid tbody tr.muted-row td { color: var(--muted); }

  [data-ayq-legacy] .categories { margin: 0 0 6px; }
  [data-ayq-legacy] .category-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  [data-ayq-legacy] .category-group { width: 150px; font-size: 11.5px; color: var(--muted); text-align: right; }
  [data-ayq-legacy] .category-name { flex: 0 1 240px; }

  [data-ayq-legacy] .backlog { margin: 22px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); }
  [data-ayq-legacy] .backlog-title { margin: 0 0 2px; font-size: 13.5px; font-weight: 600; }
  [data-ayq-legacy] .import-outcome { display: flex; flex-direction: column; gap: 2px; }
  [data-ayq-legacy] .import-done { color: var(--ink); }
  [data-ayq-legacy] .import-problem { color: var(--warn); }

  [data-ayq-legacy] .empty { padding: 26px 2px; }
  [data-ayq-legacy] .empty-title { margin: 22px 0 6px; font-size: 15px; font-weight: 550; }
  [data-ayq-legacy] .empty-body { margin: 0; max-width: 52ch; color: var(--muted); }
  [data-ayq-legacy] .muted { color: var(--muted); }
  [data-ayq-legacy] .error { white-space: pre-wrap; color: var(--warn); }
</style>
</head>
<body>
<div id="ayq-root"></div>
<script type="module" src="./ayq-client.js"></script>
</body>
</html>
