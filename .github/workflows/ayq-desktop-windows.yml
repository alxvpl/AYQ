# The AYQ desktop production path, proved on real Windows.
#
# This exists because the acceptance criterion cannot be met anywhere else:
# `better-sqlite3` must be built against Electron's ABI, and that build needs
# Electron's headers, which our development container cannot fetch. A Windows
# runner can, and Windows is the platform AYQ ships on first.
#
# The job is deliberately end to end. It does not assert that a rebuild command
# exited zero; it launches the real application and requires the real engine to
# answer from the Electron utility process.
#
# `runs-on: windows-latest` is GitHub-hosted on purpose. The inherited upstream
# workflows ask for `depot-ubuntu-latest`, a runner fleet this repository does
# not have, which is why they sit queued forever. AYQ's own CI uses runners
# that exist.

name: AYQ desktop (Windows)

on:
  push:
    branches: [claude/ayq-develop]
    paths:
      - 'ayq/ayq-desktop/**'
      - 'ayq/ayq-client/**'
      - '.github/workflows/ayq-desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: utilityProcess engine on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Record the environment
        shell: pwsh
        run: |
          Write-Host "os      : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "version : $((Get-CimInstance Win32_OperatingSystem).Version)"
          Write-Host "arch    : $env:PROCESSOR_ARCHITECTURE"
          Write-Host "node    : $(node --version)  (ABI $(node -p 'process.versions.modules'))"
          Write-Host "npm     : $(npm --version)"
          Write-Host "image   : $env:ImageOS / $env:ImageVersion"

      # The native build needs MSVC, and when node-gyp cannot find it the error
      # says only that it found nothing. This records what is actually on the
      # image, so a toolchain failure is diagnosable from the log alone rather
      # than by guessing at the runner.
      - name: Record the Visual Studio toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "vswhere        : $vswhere (present: $(Test-Path $vswhere))"
          if (Test-Path $vswhere) {
            Write-Host "installations  :"
            & $vswhere -products * -prerelease -format value -property displayName
            Write-Host "versions       :"
            & $vswhere -products * -prerelease -format value -property installationVersion
            Write-Host "paths          :"
            & $vswhere -products * -prerelease -format value -property installationPath
            Write-Host "with the C++ toolset (VC.Tools.x86.x64):"
            & $vswhere -products * -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format value -property installationVersion
          }

      # One command from a clean checkout: install, rebuild the native module
      # for the pinned Electron, and refuse to continue unless it opens a
      # database under Electron rather than merely importing.
      - name: Prepare the native engine dependency
        working-directory: ayq/ayq-desktop
        timeout-minutes: 15
        run: node setup.mjs

      - name: Typecheck
        working-directory: ayq/ayq-desktop
        run: |
          npm run typecheck
          npm --prefix ../ayq-client run typecheck

      - name: Tests
        working-directory: ayq/ayq-desktop
        timeout-minutes: 20
        run: |
          npm test
          npm --prefix ../ayq-client test

      # The acceptance test. `--require-host` makes the development Node
      # fallback unable to satisfy it: if anything but the Electron utility
      # process answers, the smoke exits non-zero.
      # `--require-empty` is the other half of removing the demo seed: a fresh
      # AYQ opens a budget with nothing in it, and the run fails if anything
      # invented is there.
      - name: Production smoke
        working-directory: ayq/ayq-desktop
        timeout-minutes: 10
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-budget
        run: >
          node start.mjs --smoke
          --require-host "electron utilityProcess"
          --require-empty
          --screenshot "${{ runner.temp }}\ayq-desktop-windows.png"

      # The first real user feature, end to end on Windows: the renderer's own
      # button, the host's picker, the CAMT parser, and the Actual API taking
      # the rows. It imports twice and requires the second to add nothing.
      #
      # The fixture is invented and lives in this repository. A real statement
      # never reaches CI, an artifact or a log — only counts travel.
      - name: CAMT.053 import acceptance
        working-directory: ayq/ayq-desktop
        timeout-minutes: 10
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-import-budget
        run: >
          node start.mjs --smoke
          --require-host "electron utilityProcess"
          --import ../ayq-camt/test/fixtures/ayq-abn-month.xml
          --screenshot "${{ runner.temp }}\ayq-desktop-import.png"

      # Nine hundred invented transactions, because every fixture until here is
      # smaller than one page of the ledger — and a page control cannot be
      # tested by a list that fits. Generated rather than committed: half a
      # megabyte of invented statement in the repository is half a megabyte
      # nobody ever reads.
      - name: A budget bigger than one page
        working-directory: ayq/ayq-desktop
        timeout-minutes: 10
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-page-budget
        run: >
          node make-scale-fixture.mjs "${{ runner.temp }}\ayq-scale.xml" 900 &&
          node start.mjs --smoke
          --require-host "electron utilityProcess"
          --import "${{ runner.temp }}\ayq-scale.xml"
          --show-more --spending

      # A file that is not a statement. The import has to refuse it, say which
      # file and why, and leave the budget exactly as empty as it found it.
      - name: An unusable file is refused, and nothing is damaged
        working-directory: ayq/ayq-desktop
        shell: pwsh
        timeout-minutes: 10
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-badimport-budget
        run: |
          $notCamt = Join-Path $env:RUNNER_TEMP 'not-camt.xml'
          Set-Content -Path $notCamt -Value '<list><item>bread</item></list>' -Encoding utf8

          $said = & node start.mjs --smoke --require-host "electron utilityProcess" `
            --import $notCamt 2>&1 | Out-String
          $refused = $LASTEXITCODE
          Write-Host $said
          if ($refused -eq 0) {
            throw 'a file that holds no statement was accepted as one'
          }
          if ($said -notmatch 'not-camt\.xml') {
            throw 'the refusal did not say which file was the problem'
          }
          if ($said -notmatch 'no CAMT\.053 entries') {
            throw 'the refusal did not say what was wrong with it'
          }

          # And the budget it refused to import into is still an empty budget,
          # which is the part that matters: a rejected file changes nothing.
          node start.mjs --smoke --require-host "electron utilityProcess" --require-empty
          if ($LASTEXITCODE -ne 0) {
            throw 'the refused import left something behind in the budget'
          }

      # What AYQ keeps beside the budget can be lost; the budget cannot. A store
      # that will not parse must not stop AYQ opening, must not be written over,
      # and must not be a silent loss — a packaged application has no console
      # for a warning to go to.
      - name: A damaged store is kept aside and said out loud
        working-directory: ayq/ayq-desktop
        shell: pwsh
        timeout-minutes: 10
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-damaged-budget
        run: |
          node start.mjs --smoke --require-host "electron utilityProcess" `
            --import ../ayq-camt/test/fixtures/ayq-abn-month.xml
          if ($LASTEXITCODE -ne 0) { throw 'the import this test needs did not work' }

          Set-Content -Path (Join-Path $env:AYQ_DATA_DIR 'ayq-store.json') `
            -Value '{"version": 1, "rules": [' -Encoding utf8

          $said = & node start.mjs --smoke --require-host "electron utilityProcess" 2>&1 |
            Out-String
          $opened = $LASTEXITCODE
          Write-Host $said
          if ($opened -ne 0) { throw 'a damaged store stopped AYQ from opening' }
          if ($said -notmatch 'rules .* are gone') {
            throw 'the screen did not say that the rules were lost'
          }
          if ($said -notmatch 'ayq-store\.damaged-') {
            throw 'the screen did not name the file that was kept'
          }
          if (-not (Get-ChildItem $env:AYQ_DATA_DIR -Filter 'ayq-store.damaged-*.json')) {
            throw 'the unreadable store was not kept'
          }
          # The transactions are Actual's, and none of this was theirs to lose.
          if ($said -notmatch '14 transactions') {
            throw 'the ledger did not come back intact'
          }

      # Categorising, twice over: the first launch files the newest transaction
      # through the control in the ledger, the second launch reopens the same
      # budget and requires it to still be filed. Two processes, one directory
      # — a restart, not a redraw.
      - name: Category acceptance
        working-directory: ayq/ayq-desktop
        timeout-minutes: 10
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-category-budget
        run: |
          node start.mjs --smoke --require-host "electron utilityProcess" --import ../ayq-camt/test/fixtures/ayq-abn-month.xml --categorise Utilities
          node start.mjs --smoke --require-host "electron utilityProcess" --expect-category Utilities --spending --screenshot "${{ runner.temp }}\ayq-desktop-categories.png"

      # Two AYQs over one budget would be two writers on one SQLite file. The
      # second launch has to stand aside while the first still holds it, and it
      # has to do so before it opens anything.
      - name: A second launch stands aside
        working-directory: ayq/ayq-desktop
        shell: pwsh
        timeout-minutes: 10
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-lock-budget
          AYQ_SMOKE_REQUIRE_HOST: electron utilityProcess
        run: |
          $env:AYQ_SMOKE_HOLD_MS = '40000'
          $env:AYQ_SMOKE_REPORT = "$env:RUNNER_TEMP\ayq-lock-first.json"
          $first = Start-Process -FilePath 'node' -ArgumentList 'start.mjs', '--smoke' `
            -PassThru -NoNewWindow

          # Ready is the budget existing on disk, not a guess at how long a
          # cold start takes: the engine creates it, so its presence means the
          # first launch is holding what the second must not touch.
          $deadline = (Get-Date).AddMinutes(4)
          while (-not (Get-ChildItem $env:AYQ_DATA_DIR -Filter 'AYQ-*' -Directory `
                        -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (-not (Get-ChildItem $env:AYQ_DATA_DIR -Filter 'AYQ-*' -Directory `
                     -ErrorAction SilentlyContinue)) {
            throw 'the first launch never opened a budget'
          }
          Write-Host 'first launch : holding the budget'

          Remove-Item Env:AYQ_SMOKE_HOLD_MS
          $env:AYQ_SMOKE_REPORT = "$env:RUNNER_TEMP\ayq-lock-second.json"
          $second = Start-Process -FilePath 'node' -ArgumentList 'start.mjs', '--smoke' `
            -PassThru -NoNewWindow -Wait
          Write-Host "second launch: exit code $($second.ExitCode)"
          $stood = Get-Content "$env:RUNNER_TEMP\ayq-lock-second.json" | ConvertFrom-Json
          $stood | ConvertTo-Json -Compress | Write-Host
          if ($second.ExitCode -ne 0) { throw 'the second launch did not exit cleanly' }
          if (-not $stood.secondInstance) {
            throw 'the second launch opened the budget instead of standing aside'
          }

          $first.WaitForExit()
          Write-Host "first launch : exit code $($first.ExitCode)"
          $held = Get-Content "$env:RUNNER_TEMP\ayq-lock-first.json" | ConvertFrom-Json
          if ($first.ExitCode -ne 0 -or -not $held.passed) {
            throw 'the launch that held the budget did not pass its own acceptance'
          }
          if ($held.secondInstance) { throw 'the first launch stood aside from itself' }

      # The product, as a person would get it: an installer, installed, and the
      # installed application driving itself through the same acceptance.
      - name: Package the Windows installer
        working-directory: ayq/ayq-desktop
        timeout-minutes: 20
        env:
          # Nothing is published from here; saying so keeps electron-builder
          # from reaching for a release API it has no business calling.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # The "signing with signtool.exe" line this step prints does not mean
        # the installer is signed. electron-builder logs it before it looks for
        # a certificate; with none configured, signFile logs "signing is
        # skipped" at debug level and returns false. Read in
        # app-builder-lib/out/codeSign/, not inferred. So the installer is
        # unsigned, and a signature appended after NSIS wrote its checksum —
        # the one explanation that fitted the crash — is ruled out.
        run: npm run package

      - name: Install it and run what was installed
        shell: pwsh
        timeout-minutes: 15
        env:
          AYQ_DATA_DIR: ${{ runner.temp }}\ayq-installed-budget
          AYQ_SMOKE: '1'
          AYQ_SMOKE_REQUIRE_HOST: electron utilityProcess
        run: |
          $setup = Get-ChildItem 'ayq\ayq-desktop\release' -Filter '*-setup.exe' |
            Select-Object -First 1
          if (-not $setup) { throw 'electron-builder produced no installer' }
          Write-Host "installer : $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"

          # /S is NSIS's silent switch and /D names the directory. The
          # installer is per-user, so it needs no administrator; naming the
          # directory means the check below looks where the files were actually
          # asked to go rather than guessing at a default.
          # Said before the attempt, because the installer has twice now died
          # with an access violation rather than refusing politely, and an
          # installer that unpacks 300 MB onto a drive that has none is the
          # first explanation to rule out. Everything named here has already
          # done its job: the unpacked build is what the installer was made
          # from, and the budgets belong to acceptance steps that have passed.
          foreach ($spent in @(
            (Join-Path $PWD 'release\win-unpacked'),
            "$env:RUNNER_TEMP\ayq-category-budget",
            "$env:RUNNER_TEMP\ayq-import-budget",
            "$env:RUNNER_TEMP\ayq-badimport-budget",
            "$env:RUNNER_TEMP\ayq-damaged-budget",
            "$env:RUNNER_TEMP\ayq-lock-budget"
          )) {
            if (Test-Path $spent) {
              Remove-Item -Recurse -Force $spent -ErrorAction SilentlyContinue
            }
          }

          foreach ($drive in @('C', 'D')) {
            $free = Get-PSDrive -Name $drive -ErrorAction SilentlyContinue
            if ($free) {
              Write-Host ("free on {0}: {1} GB" -f $drive,
                [math]::Round($free.Free / 1GB, 2))
            }
          }

          $target = Join-Path $env:RUNNER_TEMP 'ayq-install'
          $install = Start-Process -FilePath $setup.FullName `
            -ArgumentList '/S', "/D=$target" -PassThru -Wait
          Write-Host "installer exit code : $($install.ExitCode)"

          # 0xC0000005 is a crash, not a refusal. Space has been ruled out —
          # run 28 died with 218 GB free — so the next thing to ask is what
          # faulted, and Windows already knows: it records the faulting module
          # and offset for every crashed process.
          if ($install.ExitCode -eq -1073741819) {
            Write-Host 'the installer crashed with an access violation (0xC0000005)'
            # Two logs, because the Application log stayed empty for this and
            # antivirus is the remaining candidate: real-time scanning reads
            # every byte of a 118 MB executable as the installer's own checksum
            # pass reads it, and an access violation inside that read is a
            # known shape for it. The payload is provably fine — /NCRC unpacks
            # an application that then runs — so what faults is a full-file
            # read, and this is what would say who else was reading it.
            $crashes = Get-WinEvent -FilterHashtable @{
              LogName = 'Application', 'Microsoft-Windows-Windows Defender/Operational'
              StartTime = (Get-Date).AddMinutes(-5)
            } -MaxEvents 8 -ErrorAction SilentlyContinue
            if ($crashes) {
              foreach ($crash in $crashes) {
                Write-Host "--- $($crash.TimeCreated) $($crash.ProviderName)"
                Write-Host $crash.Message
              }
            } else {
              Write-Host 'Windows recorded no crash for it.'
            }

            # NSIS verifies the whole 118 MB archive before it unpacks anything,
            # and that is what the crash is early enough to be. /NCRC skips only
            # that check, so a second attempt that succeeds says where the fault
            # is, and one that crashes too says it is somewhere else. Either way
            # the answer is printed rather than inferred.
            Write-Host 'trying again without the integrity check (/NCRC)'
            $again = Start-Process -FilePath $setup.FullName `
              -ArgumentList '/S', '/NCRC', "/D=$target" -PassThru -Wait
            Write-Host "second attempt exit code : $($again.ExitCode)"
            if ($again.ExitCode -ne 0) {
              throw 'the installer crashed with and without the integrity check'
            }
            Write-Host 'NOTE: the installer only ran with /NCRC; this is not fixed.'
          }

          # The installer's own verdict, which this step used to discard. An
          # installer that refuses says so in its exit code and returns at once;
          # without reading it, a refusal was indistinguishable from a slow
          # install and cost three minutes of waiting before a message that
          # could only say what was missing, never why.
          # A refusal that is not the crash handled below. The crash branch runs
          # after this one and can recover, so this must not speak for it.
          if ($install.ExitCode -ne 0 -and $install.ExitCode -ne -1073741819) {
            throw "the installer refused with exit code $($install.ExitCode)"
          }

          # NSIS returns before it has finished writing: the silent installer
          # exits while its own work continues, so waiting on the process is
          # not waiting on the install. Wait for the file instead.
          $exe = Join-Path $target 'AYQ.exe'
          $deadline = (Get-Date).AddMinutes(3)
          while (-not (Test-Path $exe) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }

          if (-not (Test-Path $exe)) {
            Write-Host "nothing at $exe; what is there instead:"
            foreach ($place in @($target, (Join-Path $env:LOCALAPPDATA 'Programs'))) {
              if (Test-Path $place) {
                Write-Host "  $place :"
                Get-ChildItem -Recurse -Depth 1 $place |
                  Select-Object -First 40 -ExpandProperty FullName |
                  ForEach-Object { Write-Host "    $_" }
              } else {
                Write-Host "  $place : absent"
              }
            }
            throw "the installer reported success and installed nothing at $exe"
          }
          Write-Host "installed : $exe"

          # A GUI subsystem binary writes nothing to this console, so each run
          # is judged by its exit code and the report it leaves behind.
          #
          # Twice, over one data directory: the first launch imports and files
          # the newest transaction, the second is started afresh and has to
          # find it still filed. What the installed application has to prove is
          # what the working tree proves — that a category outlives the process
          # that assigned it — and one launch cannot prove it at all.
          function Invoke-Installed($label) {
            $run = Start-Process -FilePath $exe -PassThru -Wait
            Write-Host "$label exit code : $($run.ExitCode)"
            if (Test-Path $env:AYQ_SMOKE_REPORT) {
              Get-Content $env:AYQ_SMOKE_REPORT | Write-Host
            }
            if ($run.ExitCode -ne 0) {
              throw "the installed application failed its own acceptance ($label)"
            }
          }

          $env:AYQ_SMOKE_IMPORT = "$env:GITHUB_WORKSPACE\ayq\ayq-camt\test\fixtures\ayq-abn-month.xml"
          $env:AYQ_SMOKE_CATEGORISE = 'Utilities'
          $env:AYQ_SMOKE_REPORT = "$env:RUNNER_TEMP\ayq-installed-report.json"
          Invoke-Installed 'import and file  :'

          Remove-Item Env:AYQ_SMOKE_IMPORT
          Remove-Item Env:AYQ_SMOKE_CATEGORISE
          $env:AYQ_SMOKE_EXPECT_CATEGORY = 'Utilities'
          $env:AYQ_SMOKE_REPORT = "$env:RUNNER_TEMP\ayq-installed-restart-report.json"
          $env:AYQ_SMOKE_SCREENSHOT = "$env:RUNNER_TEMP\ayq-desktop-installed.png"
          Invoke-Installed 'after a restart  :'

      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayq-windows-installer
          path: ayq/ayq-desktop/release/*-setup.exe
          if-no-files-found: warn

      - name: Upload the window capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayq-desktop-windows-window
          path: |
            ${{ runner.temp }}\ayq-desktop-windows.png
            ${{ runner.temp }}\ayq-desktop-import.png
            ${{ runner.temp }}\ayq-desktop-categories.png
            ${{ runner.temp }}\ayq-desktop-installed.png
            ${{ runner.temp }}\ayq-installed-report.json
            ${{ runner.temp }}\ayq-installed-restart-report.json
            ${{ runner.temp }}\ayq-lock-first.json
            ${{ runner.temp }}\ayq-lock-second.json
          if-no-files-found: warn
